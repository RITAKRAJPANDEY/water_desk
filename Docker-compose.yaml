version: "3.8"

services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_USER=rpsfv
      - DB_NAME=ganga_v1
      - DB_PORT=5432
      - DB_HOST=db
      - DB_PASSWORD=postgres123
      - ACCESSTOKENSECRET=askdhfpoioweyhtehfksdhfgohfweoifnfw98hfowijf908hf028foidf0a808hh
      - PGPOO_LMAX=10
      - PGPOOL_TIMEOUT=30000
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=rpsfv
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=ganga_v1
    ports:
      - "5432:5432"
    volumes:
        - pgdata:/var/lib/postgresql/data
        - ./gangainit.sql:/docker-entrypoint-initdb.d/gangainit.sql
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U rpsfv -d ganga_v1"]
      interval: 5s 
      timeout: 5s
      retries: 5
volumes:
  pgdata:

